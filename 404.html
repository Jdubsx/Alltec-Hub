<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/Alltec-Hub/logo2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Alltec Hub - Technical tools and resources" />
    <link rel="apple-touch-icon" href="/Alltec-Hub/logo192.png" />
    <link rel="manifest" href="/Alltec-Hub/manifest.json" />
    <title>Alltec Hub</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      (function(l) {
        if (l.pathname.length > 1) {
          window.history.replaceState(null, null,
            '/Alltec-Hub/' +
            '?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
